name: Python QA Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # The application is nested; tests run from repository root.
        run: python -m pip install -r employee-benefits-qa/requirements.txt
      - name: Run pytest
        run: python -m pytest tests/ -v -s --junitxml=artifacts/pytest-results.xml
      - name: Initialize sample database
        run: python employee-benefits-qa/database.py
      - name: Execute SQL portfolio
        run: python employee-benefits-qa/run_queries.py > artifacts/sql-results.txt
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: artifacts/
